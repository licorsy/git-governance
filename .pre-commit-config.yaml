# Local validation — the primary governance gate for this repo and for any
# repo this plugin is scaffolded into. See CLAUDE.md for the full policy.
#
# Install once per clone:
#   pre-commit install
#   pre-commit install --hook-type commit-msg
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args:
          - feat
          - fix
          - docs
          - refactor
          - chore
          - test
          - perf
          - build
          - ci
