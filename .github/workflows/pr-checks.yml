# Minimal remote validation, kept deliberately off `develop` to save Actions
# quota. See CLAUDE.md ("Remote validation layer") for the rationale: local
# pre-commit is the primary gate everywhere, including develop; this workflow
# only runs at the two deliberate, infrequent promotion points (hom, main) or
# on demand.
name: PR checks

on:
  pull_request:
    branches: [hom, main]
  workflow_dispatch: {}

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run file-content hooks
        run: pre-commit run --all-files

      - name: Validate commit messages (Conventional Commits)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.sha }}
        run: |
          # commit-msg hooks don't run under `pre-commit run --all-files`,
          # so each commit subject in the PR range is checked explicitly.
          git log --format=%s "${BASE_REF}..${HEAD_REF}" | while IFS= read -r subject; do
            echo "$subject" > /tmp/commit-msg
            pre-commit run conventional-pre-commit --hook-stage commit-msg --commit-msg-filename /tmp/commit-msg || exit 1
          done
